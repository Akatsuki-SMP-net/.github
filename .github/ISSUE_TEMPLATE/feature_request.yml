name: Feature request
description: Suggest an improvement for an AKATSUKI SMP project.
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Explain the problem or use case.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe your suggested improvement.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe other solutions you considered.
    validations:
      required: false
